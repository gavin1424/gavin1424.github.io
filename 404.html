<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>找不到頁面｜暖線拼布工作室</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f4ec url("./assets/images/paper-texture.webp") center/640px;color:#4c4138;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;text-align:center}
    main{position:relative;width:min(100%,620px);padding:clamp(36px,8vw,64px);border:1px solid rgba(122,108,98,.18);border-radius:32px;background:#fff9f2;box-shadow:0 22px 60px rgba(102,73,52,.14)}
    main::before,main::after{content:"";position:absolute;width:96px;height:28px;top:-12px;background:#f5d777;opacity:.72;transform:rotate(-4deg)}
    main::before{left:44px}
    main::after{right:44px;transform:rotate(5deg)}
    img{width:88px;height:88px;object-fit:contain}
    .eyebrow{margin:10px 0 0;color:#7a6c62;font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:8px 0 0;color:#f28d86;font-family:"Noto Serif TC","Microsoft JhengHei",serif;font-size:clamp(4.5rem,17vw,8rem);line-height:.9}
    h2{margin:24px 0 10px;font-size:clamp(1.45rem,4vw,2rem)}
    p{margin:0;color:#7a6c62;line-height:1.8}
    a{display:inline-flex;align-items:center;justify-content:center;margin-top:26px;min-height:48px;padding:0 24px;border-radius:16px;background:#5d9d8f;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 9px 0 #417c70}
    a:focus-visible{outline:3px solid #4c4138;outline-offset:4px}
    @media (max-width:520px){main::after{display:none}}
  </style>
</head>
<body>
  <main>
    <img src="./assets/images/brand-mark-warm-thread.webp" alt="" width="88" height="88">
    <p class="eyebrow">Warm Thread Quilt Studio</p>
    <h1>404</h1>
    <h2>這塊布片還沒縫進來</h2>
    <p>你造訪的頁面不存在，回到首頁繼續探索拼布課程與暖心作品。</p>
    <a href="./">回到暖線首頁</a>
  </main>
</body>
</html>
